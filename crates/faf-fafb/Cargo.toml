[package]
name = "faf-fafb"
version = "1.0.6"
description = "FAFb v2 — the compiled binary form of .faf. Closed-canonical IFF-style chunks: 13 content chunks, Content ID + file digest. The brick."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://faf.one"
documentation = "https://docs.rs/faf-fafb"
keywords = ["faf", "fafb", "binary", "ai-context", "iff"]
categories = ["encoding", "development-tools"]
readme = "README.md"

[dependencies]
# Exact pin, not a caret: the payload bytes this crate emits ARE the Content ID
# (BINARY-FORMAT.md § Identities — "the reference compiler MUST NOT change any
# payload byte it emits for a given .faf"). A patch bump that re-quotes one
# scalar silently breaks every published Content ID, so the version moves only
# with tests/parity/serializer-edge.fafb re-pinned on purpose.
serde_yaml_ng = "=0.10.0"
thiserror = "1.0"
byteorder = "1.5"
crc32fast = "1.3"
sha2 = "0.10"
